          <line x1="0" y1="22" x2="240" y2="22" stroke="#64748b" stroke-width="2"/>
          <rect x="10" y="40" width="220" height="85" fill="#450a0a" opacity="0.3"/>
          <g stroke="#991b1b" stroke-width="1.2">
            <line x1="10" y1="55" x2="230" y2="55"/><line x1="10" y1="70" x2="230" y2="70"/><line x1="10" y1="85" x2="230" y2="85"/><line x1="10" y1="100" x2="230" y2="100"/><line x1="10" y1="115" x2="230" y2="115"/>
            <line x1="30" y1="40" x2="30" y2="125"/><line x1="60" y1="40" x2="60" y2="125"/><line x1="90" y1="40" x2="90" y2="125"/><line x1="120" y1="40" x2="120" y2="125"/><line x1="150" y1="40" x2="150" y2="125"/><line x1="180" y1="40" x2="180" y2="125"/><line x1="210" y1="40" x2="210" y2="125"/>
