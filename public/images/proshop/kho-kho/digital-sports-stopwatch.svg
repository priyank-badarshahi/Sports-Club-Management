<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#bgGrad)"/>
  <circle cx="250" cy="225" r="215" fill="url(#spotlight)"/>
  <rect x="12" y="12" width="476" height="476" rx="20" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.4"/>

  <g transform="translate(28, 28)">
    <rect width="130" height="26" rx="13" fill="#020617" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#a3e635"/>
    <text x="26" y="17" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1">KHO KHO</text>
  </g>

  <g transform="translate(345, 28)">
    <rect width="125" height="26" rx="13" fill="#a3e635" fill-opacity="0.12" stroke="#a3e635" stroke-width="1" stroke-opacity="0.3"/>
    <text x="62" y="17" text-anchor="middle" fill="#bef264" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="0.5">ACCESSORIES</text>
  </g>

  <g filter="url(#shadow)">
    
        <g transform="translate(250, 220) translate(-75, -80)">
          <!-- Handheld Digital Stopwatch with Top Buttons -->
          <circle cx="75" cy="80" r="60" fill="#1e293b" stroke="#334155" stroke-width="3"/>
          <rect x="68" y="10" width="14" height="15" rx="3" fill="#f59e0b"/>
          <rect x="35" y="16" width="12" height="12" rx="2" fill="#ef4444"/>
          <rect x="103" y="16" width="12" height="12" rx="2" fill="#22c55e"/>
          <!-- LCD Display Screen -->
          <rect x="38" y="55" width="74" height="42" rx="5" fill="#bef264"/>
          <text x="75" y="82" fill="#14532d" font-size="14" font-family="monospace" font-weight="900" text-anchor="middle">09:54:28</text>
        </g>
  </g>

  <g transform="translate(25, 415)">
    <rect width="450" height="60" rx="16" fill="#020617" fill-opacity="0.92" stroke="#1e293b" stroke-width="1"/>
    <text x="225" y="28" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">Digital Sports Stopwatch</text>
    <text x="225" y="47" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">CHAMPIONS CLUB OFFICIAL EQUIPMENT</text>
  </g>
</svg>