<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="28" fill="url(#bgGrad)"/>
  <circle cx="250" cy="225" r="215" fill="url(#spotlight)"/>
  <rect x="12" y="12" width="476" height="476" rx="20" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Top Sport Badge -->
  <g transform="translate(28, 28)">
    <rect width="130" height="26" rx="13" fill="#020617" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#a3e635"/>
    <text x="26" y="17" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1">BOX CRICKET</text>
  </g>

  <!-- Category Badge -->
  <g transform="translate(345, 28)">
    <rect width="125" height="26" rx="13" fill="#a3e635" fill-opacity="0.12" stroke="#a3e635" stroke-width="1" stroke-opacity="0.3"/>
    <text x="62" y="17" text-anchor="middle" fill="#bef264" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="0.5">BALLS</text>
  </g>

  <!-- Product Vector Illustration -->
  <g filter="url(#shadow)">
    
        <g transform="translate(250, 220)">
          <circle cx="0" cy="0" r="85" fill="#991b1b" stroke="#7f1d1d" stroke-width="3"/>
          <ellipse cx="-25" cy="-25" rx="55" ry="40" fill="#dc2626" opacity="0.4" transform="rotate(-20)"/>
          <line x1="0" y1="-85" x2="0" y2="85" stroke="#ffffff" stroke-width="4.5"/>
          <line x1="-5" y1="-80" x2="-5" y2="80" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="4,4"/>
          <line x1="5" y1="-80" x2="5" y2="80" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="4,4"/>
          <circle cx="-35" cy="0" r="18" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="-35" y="4" fill="#fbbf24" font-size="7" font-family="sans-serif" font-weight="900" text-anchor="middle">LEATHER</text>
        </g>
  </g>

  <!-- Bottom Title Plate -->
  <g transform="translate(25, 415)">
    <rect width="450" height="60" rx="16" fill="#020617" fill-opacity="0.92" stroke="#1e293b" stroke-width="1"/>
    <text x="225" y="28" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">Leather Cricket Ball</text>
    <text x="225" y="47" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">CHAMPIONS CLUB OFFICIAL EQUIPMENT</text>
  </g>
</svg>